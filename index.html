<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Türkiye Demiryolu Rota & GPS Takip</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0D1B2A;
    --panel:    #111F30;
    --border:   #1E3A52;
    --rail:     #F5C518;
    --station:  #00B4D8;
    --route:    #FF4D4D;
    --gps:      #00FF88;
    --text:     #E8F0F7;
    --muted:    #6B8CA8;
    --mono:     'Share Tech Mono', monospace;
    --sans:     'Inter', sans-serif;
  }

  html, body { 
    height: 100%; width: 100%; 
    background: var(--bg); color: var(--text); 
    font-family: var(--sans); overflow: hidden; 
  }

  /* ── Layout ── */
  .shell { 
    display: flex; flex-direction: column;
    width: 100vw; height: 100vh; height: 100dvh; 
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    flex: 0 0 auto;
    height: 50%;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
    z-index: 10;
  }

  .logo { padding: 15px 20px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--rail); text-transform: uppercase; margin-bottom: 4px; }
  .logo-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── Search boxes ── */
  .section { padding: 15px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }

  .station-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-a { background: var(--station); }
  .dot-b { background: var(--route); }

  .station-input-wrap { position: relative; flex: 1; }
  .station-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 13px; color: var(--text); outline: none; transition: border-color .2s; }
  .station-input:focus { border-color: var(--station); }
  
  .autocomplete-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #162536; border: 1px solid var(--border); border-radius: 6px; z-index: 99999; max-height: 150px; overflow-y: auto; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  .autocomplete-list.open { display: block; }
  .autocomplete-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .autocomplete-item:hover { background: var(--border); }

  /* ── Buttons ── */
  .btn-route { width: 100%; background: var(--rail); color: #0D1B2A; border: none; border-radius: 6px; padding: 11px; font-size: 13px; font-weight: 600; font-family: var(--mono); letter-spacing: 1px; cursor: pointer; text-transform: uppercase; margin-top: 4px; transition: opacity .2s; }
  .btn-route:disabled { opacity: .4; cursor: not-allowed; }
  .btn-clear { width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 12px; cursor: pointer; margin-top: 6px; transition: color .2s, border-color .2s; }
  .btn-clear:hover { color: var(--text); border-color: var(--muted); }

  /* ── Info panel ── */
  .info-panel { padding: 15px 20px; flex-shrink: 0; }
  .status-msg { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; word-wrap: break-word; }
  .status-msg.error { color: #FF6B6B; font-weight: bold; }
  .status-msg.success { color: #4ECDC4; }
  .status-msg.gps { color: var(--gps); }

  .route-stats { display: flex; flex-direction: column; gap: 8px; }
  .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .stat-value { font-family: var(--mono); font-size: 20px; color: var(--rail); }
  .stat-value.live { color: var(--gps); }
  .stat-unit { font-size: 11px; color: var(--muted); margin-left: 3px; }

  /* ── Loading bar ── */
  .loading-bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; margin-bottom: 12px; display: none; }
  .loading-bar.active { display: block; }
  .loading-bar-fill { height: 100%; background: var(--rail); width: 0%; animation: loading 1.5s ease-in-out infinite; }
  @keyframes loading { 0% { width: 0%; margin-left: 0; } 50% { width: 70%; margin-left: 15%; } 100% { width: 0%; margin-left: 100%; } }

  /* ── Map ── */
  #map { 
    flex: 1 1 auto; 
    height: 50%; 
    width: 100%; 
    background: #0a1520; 
    z-index: 1; 
  }

  /* Leaflet dark override */
  .leaflet-tile { filter: brightness(0.55) saturate(0.4) hue-rotate(190deg); }
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }

  /* ── Desktop View ── */
  @media (min-width: 601px) {
    .shell { flex-direction: row; }
    .sidebar { width: 320px; height: 100%; flex: 0 0 320px; border-right: 1px solid var(--border); border-bottom: none; }
    #map { height: 100%; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-tag">TCDD · Demiryolu</div>
      <div class="logo-title">Rota Planlayıcı & GPS</div>
      <div class="logo-sub">Gerçek demiryolu verisi · Türkiye</div>
    </div>

    <div class="section">
      <div class="section-label">Güzergah Seç</div>
      <div class="station-row">
        <div class="dot dot-a"></div>
        <div class="station-input-wrap">
          <input class="station-input" id="inputA" type="text" placeholder="Kalkış istasyonu..." autocomplete="off"/>
          <div class="autocomplete-list" id="listA"></div>
        </div>
      </div>
      <div class="station-row">
        <div class="dot dot-b"></div>
        <div class="station-input-wrap">
          <input class="station-input" id="inputB" type="text" placeholder="Varış istasyonu..." autocomplete="off"/>
          <div class="autocomplete-list" id="listB"></div>
        </div>
      </div>
      <button class="btn-route" id="btnRoute" disabled>Rotayı Göster</button>
      <button class="btn-clear" id="btnClear">Seçimleri Temizle</button>
      <button class="btn-route" id="btnGps" style="background:var(--gps); color:#0D1B2A; margin-top:10px;">GPS & Hız Ölçer Başlat</button>
    </div>

    <div class="info-panel">
      <div class="loading-bar" id="loadingBar"><div class="loading-bar-fill"></div></div>
      <div class="status-msg" id="statusMsg">Harita altyapısı hazırlanıyor...</div>
      
      <div class="route-stats" id="routeStats" style="display:none">
        <div class="stat-box">
          <div class="stat-label">Toplam Mesafe</div>
          <div class="stat-value" id="statDist">—<span class="stat-unit">km</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Tahmini Süre (120km/h)</div>
          <div class="stat-value" id="statTime">—<span class="stat-unit">dk</span></div>
        </div>
      </div>
      
      <!-- GPS Canlı Veriler -->
      <div class="route-stats" style="margin-top: 10px;">
        <div class="stat-box" id="boxSpeed" style="display:none; border-color:var(--gps);">
          <div class="stat-label" style="color:var(--gps)">Anlık Hız</div>
          <div class="stat-value live" id="statSpeed">0<span class="stat-unit" style="color:var(--gps)">km/h</span></div>
        </div>
        <div class="stat-box" id="boxRemTime" style="display:none; border-color:var(--gps);">
          <div class="stat-label" style="color:var(--gps)">Canlı Kalan Süre</div>
          <div class="stat-value live" id="statRemTime">—</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAP -->
  <div id="map"></div>

</div>

<script>
// --- Global Hata Yakalayıcı ---
window.onerror = function(msg, url, lineNo, columnNo, error) {
  const el = document.getElementById('statusMsg');
  if(el) {
    el.textContent = "SİSTEM HATASI: " + msg;
    el.className = 'status-msg error';
  }
  return false;
};

document.addEventListener("DOMContentLoaded", function() {
  if (typeof L === 'undefined') {
    const el = document.getElementById('statusMsg');
    el.textContent = "Kritik Hata: Harita kütüphanesi yüklenemedi. Lütfen internet bağlantınızı kontrol edip sayfayı yenileyin.";
    el.className = 'status-msg error';
    return;
  }

  // ── Map init ──────────────────────────────────────────────────────
  const map = L.map('map', {
    center: [39.0, 35.5],
    zoom: 5, 
    zoomControl: true,
    attributionControl: false
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  setTimeout(() => map.invalidateSize(), 500);
  window.addEventListener('resize', () => map.invalidateSize());

  // ── State ─────────────────────────────────────────────────────────
  let railwayLines   = [];
  let stations       = [];
  let stationMarkers = [];
  let railLayers     = [];
  let routeLayer     = null;
  let currentPath    = [];
  let markerA        = null;
  let markerB        = null;
  let selectedA      = null;
  let selectedB      = null;

  let gpsWatchId = null;
  let userMarker = null;

  const statusEl   = document.getElementById('statusMsg');
  const loadingEl  = document.getElementById('loadingBar');
  const statsEl    = document.getElementById('routeStats');
  const btnRoute   = document.getElementById('btnRoute');
  const btnClear   = document.getElementById('btnClear');
  const btnGps     = document.getElementById('btnGps');
  const boxSpeed   = document.getElementById('boxSpeed');
  const boxRemTime = document.getElementById('boxRemTime');

  // ── Helpers ───────────────────────────────────────────────────────
  function setStatus(msg, type='') {
    statusEl.textContent = msg;
    statusEl.className = 'status-msg' + (type ? ' '+type : '');
  }
  function setLoading(on) {
    loadingEl.className = 'loading-bar' + (on ? ' active' : '');
  }
  
  function haversine(a, b) {
    const R = 6371;
    const toR = function(d) { return d * Math.PI / 180; };
    const dLat = toR(b[0] - a[0]);
    const dLon = toR(b[1] - a[1]);
    const sinLat = Math.sin(dLat / 2);
    const sinLon = Math.sin(dLon / 2);
    const x = (sinLat * sinLat) + Math.cos(toR(a[0])) * Math.cos(toR(b[0])) * (sinLon * sinLon);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  // ── Overpass fetch ────────────────────────────────────────────────
  async function fetchOverpass(query) {
    const url = 'https://overpass-api.de/api/interpreter';
    const r = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data='+encodeURIComponent(query)
    });
    if (!r.ok) throw new Error('Overpass reddetti (Kod: '+r.status+'). Çok fazla istek atmış olabilirsiniz, biraz bekleyin.');
    return r.json();
  }

  // ── Load railways ─────────────────────────────────────────────────
  async function loadRailways() {
    setLoading(true);
    setStatus('Türkiye demiryolu verileri indiriliyor (10-20 sn sürebilir)…');

    const query = `
      [out:json][timeout:90];
      area["ISO3166-1"="TR"][admin_level=2]->.tr;
      (way["railway"~"^(rail|narrow_gauge|light_rail|preserved)$"](area.tr););
      out geom;
    `;

    try {
      const data = await fetchOverpass(query);
      railwayLines = [];
      data.elements.forEach(el => {
        if (el.type === 'way' && el.geometry) {
          const coords = el.geometry.map(p => [p.lat, p.lon]);
          if (coords.length >= 2) railwayLines.push({ coords, tags: el.tags || {}, id: el.id });
        }
      });
      drawRailways();
      setStatus(`${railwayLines.length} hat yüklendi. İstasyonlar alınıyor…`);
      await loadStations();
    } catch(e) {
      setLoading(false);
      setStatus('Hata: ' + e.message, 'error');
    }
  }

  function drawRailways() {
    railLayers.forEach(l => map.removeLayer(l));
    railLayers = [];
    railwayLines.forEach(line => {
      const layer = L.polyline(line.coords, { color: '#F5C518', weight: 1.8, opacity: 0.6, lineJoin:'round', lineCap:'round' }).addTo(map);
      railLayers.push(layer);
    });
  }

  async function loadStations() {
    const query = `
      [out:json][timeout:60];
      area["ISO3166-1"="TR"][admin_level=2]->.tr;
      (node["railway"="station"](area.tr); node["railway"="halt"](area.tr););
      out body;
    `;
    try {
      const data = await fetchOverpass(query);
      stations = [];
      data.elements.forEach(el => {
        const name = el.tags['name:tr'] || el.tags.name || null;
        if (name) stations.push({ name, lat: el.lat, lng: el.lon, id: el.id, tags: el.tags });
      });
      stations.sort((a,b) => a.name.localeCompare(b.name, 'tr'));
      drawStationDots();
      setLoading(false);
      setStatus(`Tüm veriler hazır! Kalkış ve varış seçiniz.`, 'success');
    } catch(e) {
      setLoading(false);
      setStatus('İstasyon hatası: ' + e.message, 'error');
    }
  }

  function drawStationDots() {
    stationMarkers.forEach(m => map.removeLayer(m));
    stationMarkers = [];
    stations.forEach(st => {
      const circle = L.circleMarker([st.lat, st.lng], { radius: 4, color:'#00B4D8', fillColor:'#00B4D8', fillOpacity:.8, weight:1.5 }).addTo(map);
      circle.bindTooltip(st.name);
      stationMarkers.push(circle);
    });
  }

  // ── Autocomplete ──────────────────────────────────────────────────
  function setupAutocomplete(inputId, listId, onSelect) {
    const input = document.getElementById(inputId);
    const list  = document.getElementById(listId);

    input.addEventListener('input', () => {
      const val = input.value.trim().toLocaleLowerCase('tr-TR');
      list.innerHTML = '';
      if (val.length < 1) { list.classList.remove('open'); return; }

      const matches = stations.filter(s => s.name.toLocaleLowerCase('tr-TR').includes(val)).slice(0, 10);
      if (!matches.length) { list.classList.remove('open'); return; }

      matches.forEach(st => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.innerHTML = st.name;
        item.addEventListener('mousedown', e => {
          e.preventDefault();
          input.value = st.name;
          list.classList.remove('open');
          onSelect(st);
        });
        list.appendChild(item);
      });
      list.classList.add('open');
    });
    input.addEventListener('blur', () => setTimeout(()=>list.classList.remove('open'), 200));
  }

  // ── Route finding ─────────────────────────────────────────────────
  const iconA = L.divIcon({ html:'<div style="background:#00B4D8;width:14px;height:14px;border-radius:50%;border:2px solid #fff;"></div>', className:'', iconAnchor:[7,7] });
  const iconB = L.divIcon({ html:'<div style="background:#FF4D4D;width:14px;height:14px;border-radius:50%;border:2px solid #fff;"></div>', className:'', iconAnchor:[7,7] });

  function pinA(st) {
    if (markerA) map.removeLayer(markerA);
    markerA = L.marker([st.lat, st.lng], {icon:iconA}).addTo(map).bindPopup(`<b>Kalkış:</b> ${st.name}`);
    selectedA = st; checkReady();
  }
  function pinB(st) {
    if (markerB) map.removeLayer(markerB);
    markerB = L.marker([st.lat, st.lng], {icon:iconB}).addTo(map).bindPopup(`<b>Varış:</b> ${st.name}`);
    selectedB = st; checkReady();
  }
  function checkReady() { btnRoute.disabled = !(selectedA && selectedB); }

  function buildGraph() {
    const graph = new Map();
    const keyOf = function(pt) { return pt[0].toFixed(5) + ',' + pt[1].toFixed(5); };

    function addEdge(a, b, dist) {
      const ka = keyOf(a), kb = keyOf(b);
      if (!graph.has(ka)) graph.set(ka, []);
      if (!graph.has(kb)) graph.set(kb, []);
      graph.get(ka).push({ key:kb, dist, coord:b });
      graph.get(kb).push({ key:ka, dist, coord:a });
    }
    railwayLines.forEach(line => {
      for (let i=0; i<line.coords.length-1; i++) {
        addEdge(line.coords[i], line.coords[i+1], haversine(line.coords[i], line.coords[i+1]));
      }
    });
    return { graph, keyOf };
  }

  function dijkstra(graph, keyOf, startCoord, endCoord) {
    const startKey = keyOf(startCoord), endKey = keyOf(endCoord);
    const dist = new Map(), prev = new Map(), visited = new Set();
    const queue = [{ key:startKey, d:0, coord:startCoord }];
    dist.set(startKey, 0);

    let iterations = 0;
    while (queue.length && iterations++ < 250000) {
      queue.sort(function(a,b) { return a.d - b.d; });
      const current = queue.shift();
      if (visited.has(current.key)) continue;
      visited.add(current.key);
      if (current.key === endKey) break;

      const neighbors = graph.get(current.key) || [];
      for (let i=0; i<neighbors.length; i++) {
        const nb = neighbors[i];
        if (visited.has(nb.key)) continue;
        const nd = current.d + nb.dist;
        if (!dist.has(nb.key) || nd < dist.get(nb.key)) {
          dist.set(nb.key, nd);
          prev.set(nb.key, { key: current.key, coord: current.coord });
          queue.push({ key:nb.key, d:nd, coord:nb.coord });
        }
      }
    }
    const path = [];
    let cur = endKey;
    while (cur && prev.has(cur)) {
      const p = prev.get(cur);
      path.unshift(p.coord);
      cur = p.key;
    }
    if (path.length) path.push(endCoord);
    return { path, totalDist: dist.get(endKey) || 0 };
  }

  function drawRoute() {
    if (!selectedA || !selectedB) return;
    if (routeLayer) map.removeLayer(routeLayer);
    statsEl.style.display = 'none';
    if(gpsWatchId) boxRemTime.style.display = 'none';
    currentPath = [];
    setLoading(true); setStatus('Rota hesaplanıyor…');

    setTimeout(() => {
      try {
        const { graph, keyOf } = buildGraph();
        
        let nodeA = null, nodeB = null, minDA = Infinity, minDB = Infinity;
        railwayLines.forEach(line => {
          line.coords.forEach(c => {
            let da = haversine([selectedA.lat, selectedA.lng], c);
            let db = haversine([selectedB.lat, selectedB.lng], c);
            if(da < minDA) { minDA = da; nodeA = c; }
            if(db < minDB) { minDB = db; nodeB = c; }
          });
        });

        if (!nodeA || !nodeB) { setStatus('İstasyonlar hattan çok uzak.', 'error'); setLoading(false); return; }

        const { path, totalDist } = dijkstra(graph, keyOf, nodeA, nodeB);
        if (!path.length) { setStatus('Hatlar arasında bağlantı kurulamadı.', 'error'); setLoading(false); return; }

        currentPath = path;
        routeLayer = L.polyline(path, { color: '#FF4D4D', weight: 5, opacity: 0.9 }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });

        const distKm = totalDist.toFixed(1);
        const timeMin = Math.round((totalDist / 120) * 60);

        document.getElementById('statDist').innerHTML = `${distKm}<span class="stat-unit">km</span>`;
        document.getElementById('statTime').innerHTML = `${timeMin}<span class="stat-unit">dk</span>`;
        statsEl.style.display = 'flex';
        
        setStatus(`Rota başarıyla çizildi: ${distKm} km`, 'success');
        setLoading(false);
      } catch (err) {
        setStatus('Rota he
