<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota — Harita</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2422;
    --parchment:#FBF7EE;
    --parchment-2:#F2ECDD;
    --pine:#16302B;
    --pine-2:#1F4038;
    --amber:#E2A32D;
    --coral:#E2725B;
    --line:#DCD3BE;
    --shadow: 0 10px 30px -8px rgba(22,48,43,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Inter',sans-serif;color:var(--ink);}
  #map{position:absolute;inset:0;z-index:0;background:#EDEAE0;}

  .leaflet-control-attribution{font-size:10px;background:rgba(251,247,238,0.85)!important;}

  /* ---- Brand mark ---- */
  .brand{
    position:absolute; top:16px; left:16px; z-index:500;
    display:flex; align-items:center; gap:10px;
    background:var(--pine); color:var(--parchment);
    padding:8px 14px 8px 10px; border-radius:999px;
    box-shadow:var(--shadow);
    font-family:'Space Grotesk',sans-serif;
    user-select:none;
  }
  .brand svg{display:block;}
  .brand span{font-weight:700; font-size:17px; letter-spacing:0.2px;}

  /* ---- Search panel ---- */
  .search-wrap{
    position:absolute; top:16px; left:16px; z-index:400;
    width:min(400px, calc(100vw - 32px));
    margin-left:0;
  }
  .search-shell{
    margin-left:190px;
  }
  @media (max-width:640px){
    .brand span{display:none;}
    .brand{padding:8px;}
    .search-shell{margin-left:52px;}
  }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--parchment); border-radius:16px;
    box-shadow:var(--shadow); padding:12px 14px;
    border:1px solid var(--line);
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500;
    color:var(--ink); flex:1; min-width:0;
  }
  .search-box input::placeholder{color:#8A8574;}
  .search-box svg{flex-shrink:0; color:var(--pine);}
  .search-clear{cursor:pointer; color:#8A8574; border:none; background:none; display:none; padding:2px;}
  .search-clear.show{display:flex;}

  .results{
    margin-top:8px; background:var(--parchment); border-radius:16px;
    box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--line);
    max-height:0; opacity:0; transition:max-height .25s ease, opacity .2s ease;
  }
  .results.open{max-height:320px; opacity:1; overflow-y:auto;}
  .result-item{
    padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
    cursor:pointer; border-bottom:1px solid var(--line);
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:hover{background:var(--parchment-2);}
  .result-item svg{flex-shrink:0; margin-top:2px; color:var(--coral);}
  .result-title{font-weight:600; font-size:13.5px;}
  .result-sub{font-size:12px; color:#7B7websafe968; color:#867F6C; margin-top:2px;}

  /* ---- Place card ---- */
  .place-card{
    position:absolute; left:16px; bottom:16px; z-index:400;
    width:min(340px, calc(100vw - 32px));
    background:var(--parchment); border-radius:18px;
    box-shadow:var(--shadow); border:1px solid var(--line);
    padding:16px; display:none; font-family:'Inter',sans-serif;
  }
  .place-card.show{display:block;}
  .place-card .eyebrow{
    font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--coral); font-weight:700; margin-bottom:4px;
  }
  .place-card h3{margin:0 0 4px 0; font-size:16.5px; font-family:'Space Grotesk',sans-serif;}
  .place-card p{margin:0 0 12px 0; font-size:12.5px; color:#5B5648; line-height:1.5;}
  .place-actions{display:flex; gap:8px;}
  .btn{
    border:none; border-radius:12px; padding:10px 14px; font-weight:600;
    font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--pine); color:var(--parchment); flex:1; justify-content:center;}
  .btn-primary:hover{background:var(--pine-2);}
  .btn-ghost{background:var(--parchment-2); color:var(--ink);}
  .btn-ghost:hover{background:var(--line);}
  .card-close{
    position:absolute; top:10px; right:10px; border:none; background:none;
    color:#867F6C; cursor:pointer; padding:4px;
  }

  /* ---- Route panel ---- */
  .route-panel{
    position:absolute; left:16px; bottom:16px; z-index:410;
    width:min(360px, calc(100vw - 32px));
    background:var(--parchment); border-radius:18px;
    box-shadow:var(--shadow); border:1px solid var(--line);
    padding:16px; display:none;
  }
  .route-panel.show{display:block;}
  .route-header{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  }
  .route-fields{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .route-field{
    display:flex; align-items:center; gap:8px; background:var(--parchment-2);
    border-radius:12px; padding:9px 12px; border:1px solid var(--line);
  }
  .route-field .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .dot-a{background:var(--pine);} .dot-b{background:var(--coral);}
  .route-field input{border:none; background:transparent; outline:none; font-size:13px; flex:1; min-width:0; font-family:'Inter',sans-serif;}
  .route-summary{
    display:flex; gap:16px; background:var(--pine); color:var(--parchment);
    border-radius:12px; padding:12px 14px; margin-bottom:10px; display:none;
  }
  .route-summary.show{display:flex;}
  .route-summary .stat{flex:1;}
  .route-summary .stat .val{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .route-summary .stat .lab{font-size:10.5px; opacity:0.75; text-transform:uppercase; letter-spacing:1px; margin-top:2px;}

  /* ---- Right side controls ---- */
  .controls{
    position:absolute; right:16px; bottom:16px; z-index:400;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .ctrl-stack{
    background:var(--parchment); border-radius:14px; box-shadow:var(--shadow);
    overflow:hidden; border:1px solid var(--line);
  }
  .ctrl-btn{
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; cursor:pointer; color:var(--pine);
  }
  .ctrl-btn:hover{background:var(--parchment-2);}
  .ctrl-stack .ctrl-btn:not(:last-child){border-bottom:1px solid var(--line);}
  .ctrl-single{
    width:44px; height:44px; border-radius:14px; background:var(--parchment);
    box-shadow:var(--shadow); border:1px solid var(--line); color:var(--pine);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .ctrl-single:hover{background:var(--parchment-2);}
  .ctrl-single.active{background:var(--amber); color:var(--pine);}

  .loading-pulse{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    z-index:600; background:var(--pine); color:var(--parchment);
    padding:8px 16px; border-radius:999px; font-size:12.5px; font-weight:600;
    box-shadow:var(--shadow); display:none; font-family:'Inter',sans-serif;
  }
  .loading-pulse.show{display:block;}

  .rota-pin{
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="loading-pulse" id="loadingPulse">Aranıyor…</div>

<div class="brand">
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
    <circle cx="13" cy="13" r="12" stroke="#E2A32D" stroke-width="1.6"/>
    <path d="M13 4 L15.5 11.5 L23 13 L15.5 14.5 L13 22 L10.5 14.5 L3 13 L10.5 11.5 Z" fill="#E2725B"/>
  </svg>
  <span>Rota</span>
</div>

<div class="search-wrap">
  <div class="search-shell">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Yer, adres veya işletme ara" autocomplete="off">
      <button class="search-clear" id="clearBtn" aria-label="Temizle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="place-card" id="placeCard">
  <button class="card-close" id="cardClose">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="eyebrow">Konum</div>
  <h3 id="cardTitle">—</h3>
  <p id="cardSub">—</p>
  <div class="place-actions">
    <button class="btn btn-primary" id="cardDirections">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      Yol tarifi
    </button>
    <button class="btn btn-ghost" id="cardCopy">Koordinat</button>
  </div>
</div>

<div class="route-panel" id="routePanel">
  <div class="route-header">
    <span>Yol Tarifi</span>
    <button class="card-close" style="position:static;" id="routeClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="route-fields">
    <div class="route-field"><span class="dot dot-a"></span><input id="fromInput" placeholder="Başlangıç noktası"></div>
    <div class="route-field"><span class="dot dot-b"></span><input id="toInput" placeholder="Varış noktası"></div>
  </div>
  <div class="route-summary" id="routeSummary">
    <div class="stat"><div class="val" id="routeDist">—</div><div class="lab">Mesafe</div></div>
    <div class="stat"><div class="val" id="routeTime">—</div><div class="lab">Süre</div></div>
  </div>
  <button class="btn btn-primary" id="routeGo" style="width:100%;">Rotayı çiz</button>
</div>

<div class="controls">
  <div class="ctrl-single" id="satToggle" title="Uydu görünümü">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <div class="ctrl-single" id="locateBtn" title="Konumumu bul">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </div>
  <div class="ctrl-stack">
    <button class="ctrl-btn" id="zoomIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ctrl-btn" id="zoomOut"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/></svg></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map', {zoomControl:false}).setView([39.925, 32.866], 6); // Türkiye merkezli

  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap katkıda bulunanlar'
  }).addTo(map);

  const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:19, attribution:'Kaynak: Esri'
  });

  let satOn = false;
  document.getElementById('satToggle').addEventListener('click', (e)=>{
    satOn = !satOn;
    e.currentTarget.classList.toggle('active', satOn);
    if(satOn){ map.removeLayer(osmLayer); satLayer.addTo(map); }
    else { map.removeLayer(satLayer); osmLayer.addTo(map); }
  });

  document.getElementById('zoomIn').addEventListener('click', ()=>map.zoomIn());
  document.getElementById('zoomOut').addEventListener('click', ()=>map.zoomOut());

  document.getElementById('locateBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){ return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude, longitude} = pos.coords;
      map.setView([latitude, longitude], 15);
      L.circleMarker([latitude, longitude], {radius:8, color:'#E2A32D', fillColor:'#E2A32D', fillOpacity:0.9, weight:3}).addTo(map);
    }, ()=>{}, {enableHighAccuracy:true, timeout:8000});
  });

  // ---- Custom pin icon ----
  function makePin(color){
    return L.divIcon({
      className:'',
      html:`<div class="rota-pin"><svg width="34" height="42" viewBox="0 0 34 42" fill="none">
        <path d="M17 0C7.6 0 0 7.6 0 17c0 12.7 17 25 17 25s17-12.3 17-25C34 7.6 26.4 0 17 0Z" fill="${color}"/>
        <circle cx="17" cy="17" r="6.5" fill="#FBF7EE"/>
      </svg></div>`,
      iconSize:[34,42], iconAnchor:[17,42]
    });
  }
  const pinCoral = makePin('#E2725B');
  const pinPine = makePin('#16302B');

  let searchMarker=null, routeLine=null, routeMarkers=[];
  const loadingPulse = document.getElementById('loadingPulse');
  const showLoading = (t)=>{ loadingPulse.textContent=t; loadingPulse.classList.add('show'); };
  const hideLoading = ()=> loadingPulse.classList.remove('show');

  // ---- Search (Nominatim) ----
  const searchInput = document.getElementById('searchInput');
  const resultsEl = document.getElementById('results');
  const clearBtn = document.getElementById('clearBtn');
  let searchTimer=null;

  searchInput.addEventListener('input', ()=>{
    clearBtn.classList.toggle('show', searchInput.value.length>0);
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if(q.length<3){ resultsEl.classList.remove('open'); return; }
    searchTimer = setTimeout(()=>doSearch(q), 400);
  });

  clearBtn.addEventListener('click', ()=>{
    searchInput.value=''; clearBtn.classList.remove('show'); resultsEl.classList.remove('open'); resultsEl.innerHTML='';
  });

  async function doSearch(q){
    showLoading('Aranıyor…');
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=6&addressdetails=1`);
      const data = await res.json();
      renderResults(data);
    }catch(e){
      resultsEl.innerHTML = `<div class="result-item">Sonuç alınamadı, tekrar deneyin.</div>`;
      resultsEl.classList.add('open');
    }
    hideLoading();
  }

  function renderResults(data){
    if(!data.length){
      resultsEl.innerHTML = `<div class="result-item">Sonuç bulunamadı.</div>`;
      resultsEl.classList.add('open');
      return;
    }
    resultsEl.innerHTML = data.map((item,i)=>`
      <div class="result-item" data-i="${i}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <div>
          <div class="result-title">${(item.display_name||'').split(',')[0]}</div>
          <div class="result-sub">${item.display_name||''}</div>
        </div>
      </div>
    `).join('');
    resultsEl.classList.add('open');
    resultsEl.querySelectorAll('.result-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const item = data[+el.dataset.i];
        selectPlace(item);
        resultsEl.classList.remove('open');
      });
    });
  }

  function selectPlace(item){
    const lat = parseFloat(item.lat), lon = parseFloat(item.lon);
    if(searchMarker) map.removeLayer(searchMarker);
    searchMarker = L.marker([lat,lon], {icon:pinCoral}).addTo(map);
    map.setView([lat,lon], 15);
    document.getElementById('cardTitle').textContent = (item.display_name||'').split(',')[0];
    document.getElementById('cardSub').textContent = item.display_name || '';
    document.getElementById('placeCard').classList.add('show');
    document.getElementById('placeCard').dataset.lat = lat;
    document.getElementById('placeCard').dataset.lon = lon;
    document.getElementById('routePanel').classList.remove('show');
  }

  document.getElementById('cardClose').addEventListener('click', ()=>{
    document.getElementById('placeCard').classList.remove('show');
    if(searchMarker){ map.removeLayer(searchMarker); searchMarker=null; }
  });

  document.getElementById('cardCopy').addEventListener('click', (e)=>{
    const card = document.getElementById('placeCard');
    navigator.clipboard?.writeText(`${card.dataset.lat}, ${card.dataset.lon}`).catch(()=>{});
    e.currentTarget.textContent = 'Kopyalandı ✓';
    setTimeout(()=> e.currentTarget.textContent='Koordinat', 1500);
  });

  // ---- Map click -> reverse geocode ----
  map.on('click', async (e)=>{
    const {lat,lng} = e.latlng;
    showLoading('Konum alınıyor…');
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
      const item = await res.json();
      if(searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker([lat,lng], {icon:pinCoral}).addTo(map);
      document.getElementById('cardTitle').textContent = (item.display_name||'Bilinmeyen konum').split(',')[0];
      document.getElementById('cardSub').textContent = item.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById('placeCard').classList.add('show');
      document.getElementById('placeCard').dataset.lat = lat;
      document.getElementById('placeCard').dataset.lon = lng;
    }catch(err){}
    hideLoading();
  });

  // ---- Directions ----
  const routePanel = document.getElementById('routePanel');
  const fromInput = document.getElementById('fromInput');
  const toInput = document.getElementById('toInput');
  let fromCoord=null, toCoord=null;

  document.getElementById('cardDirections').addEventListener('click', ()=>{
    const card = document.getElementById('placeCard');
    toCoord = [parseFloat(card.dataset.lat), parseFloat(card.dataset.lon)];
    toInput.value = document.getElementById('cardTitle').textContent;
    card.classList.remove('show');
    routePanel.classList.add('show');
    fromInput.focus();
  });

  document.getElementById('routeClose').addEventListener('click', ()=>{
    routePanel.classList.remove('show');
    document.getElementById('routeSummary').classList.remove('show');
    if(routeLine){ map.removeLayer(routeLine); routeLine=null; }
    routeMarkers.forEach(m=>map.removeLayer(m)); routeMarkers=[];
  });

  async function geocodeText(text){
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(text)}&limit=1`);
    const data = await res.json();
    if(!data.length) return null;
    return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  }

  document.getElementById('routeGo').addEventListener('click', async ()=>{
    showLoading('Rota hesaplanıyor…');
    try{
      if(fromInput.value.trim().toLowerCase()==='konumum' || fromInput.value.trim()===''){
        if(!fromCoord){
          await new Promise((resolve)=>{
            if(!navigator.geolocation) return resolve();
            navigator.geolocation.getCurrentPosition(pos=>{
              fromCoord=[pos.coords.latitude,pos.coords.longitude];
              fromInput.value='Konumum';
              resolve();
            }, ()=>resolve(), {timeout:6000});
          });
        }
      } else {
        fromCoord = await geocodeText(fromInput.value.trim());
      }
      if(toInput.value.trim() && (!toCoord)){
        toCoord = await geocodeText(toInput.value.trim());
      }
      if(!fromCoord || !toCoord){
        hideLoading();
        alert('Başlangıç ve varış noktalarını girin.');
        return;
      }
      const url = `https://router.project-osrm.org/route/v1/driving/${fromCoord[1]},${f
