<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Türkiye Demiryolu Rota & GPS Takip</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0D1B2A;
  --panel:   #111F30;
  --border:  #1E3A52;
  --rail:    #F5C518;
  --station: #00B4D8;
  --route:   #FF4D4D;
  --gps:     #00FF88;
  --text:    #E8F0F7;
  --muted:   #6B8CA8;
  --mono:    'Share Tech Mono', monospace;
  --sans:    'Inter', sans-serif;
}

html, body {
  height: 100%; width: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

/* ── Shell ── */
.shell {
  display: flex; flex-direction: column;
  width: 100vw; height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  flex: 0 0 auto;
  max-height: 52vh;
  background: var(--panel);
  border-bottom: 2px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  z-index: 10;
}

.logo {
  padding: 12px 18px 9px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: sticky; top: 0;
  background: var(--panel);
  z-index: 2;
}
.logo-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 3px; color: var(--rail); text-transform: uppercase; margin-bottom: 3px; }
.logo-title { font-size: 17px; font-weight: 600; }
.logo-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ── Sections ── */
.section { padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.section-label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }

.station-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-a { background: var(--station); box-shadow: 0 0 6px var(--station); }
.dot-b { background: var(--route); box-shadow: 0 0 6px var(--route); }

.station-input-wrap { position: relative; flex: 1; }
.station-input {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 9px 12px; font-size: 14px; color: var(--text);
  outline: none; transition: border-color .2s;
  -webkit-appearance: none; font-family: var(--sans);
}
.station-input:focus { border-color: var(--station); }

.autocomplete-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: #162536; border: 1px solid var(--border); border-radius: 6px;
  z-index: 99999; max-height: 170px; overflow-y: auto;
  display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.65);
  -webkit-overflow-scrolling: touch;
}
.autocomplete-list.open { display: block; }
.autocomplete-item {
  padding: 10px 12px; font-size: 13px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
  transition: background .1s;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.active { background: var(--border); }

/* ── Buttons ── */
.btn {
  width: 100%; border: none; border-radius: 6px;
  padding: 11px; font-size: 13px; font-weight: 600;
  font-family: var(--mono); letter-spacing: 1px;
  cursor: pointer; text-transform: uppercase;
  transition: opacity .2s, transform .1s, filter .2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.97); }

.btn-primary { background: var(--rail); color: #0D1B2A; margin-top: 6px; }
.btn-primary:disabled { opacity: .3; cursor: not-allowed; transform: none; }

.btn-gps { background: var(--gps); color: #0D1B2A; margin-top: 8px; }
.btn-gps.active { background: #FF4D4D; color: #fff; }

.btn-outline {
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); margin-top: 6px;
  padding: 9px; font-size: 12px;
  transition: color .2s, border-color .2s, transform .1s;
}
.btn-outline:hover, .btn-outline:active { color: var(--text); border-color: var(--muted); }

.btn-retry {
  background: transparent; border: 1px solid #FF6B6B;
  color: #FF6B6B; border-radius: 6px;
  padding: 7px 14px; font-size: 12px; cursor: pointer;
  margin-top: 6px; display: none; touch-action: manipulation;
  font-family: var(--sans);
}
.btn-retry.show { display: inline-block; }
.btn-retry:hover { background: rgba(255,107,107,.1); }

/* ── Info panel ── */
.info-panel { padding: 12px 18px 14px; flex-shrink: 0; }

.status-msg {
  font-size: 12px; color: var(--muted);
  line-height: 1.65; margin-bottom: 10px;
  word-break: break-word; min-height: 20px;
}
.status-msg.error   { color: #FF6B6B; font-weight: 600; }
.status-msg.success { color: #4ECDC4; }
.status-msg.gps     { color: var(--gps); }
.status-msg.warn    { color: #F5C518; }

/* Loading bar */
.loading-bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; margin-bottom: 10px; display: none; }
.loading-bar.active { display: block; }
.loading-bar-fill { height: 100%; background: var(--rail); animation: loadpulse 1.4s ease-in-out infinite; }
@keyframes loadpulse { 0%{margin-left:-55%;width:55%} 100%{margin-left:110%;width:55%} }

/* Stats grid */
.stats-row { display: flex; gap: 7px; margin-bottom: 8px; }
.stat-box {
  flex: 1; min-width: 80px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 11px;
}
.stat-label { font-family: var(--mono); font-size: 8px; letter-spacing: 1.8px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-family: var(--mono); font-size: 21px; color: var(--rail); line-height: 1; }
.stat-value.live { color: var(--gps); }
.stat-unit { font-size: 10px; color: var(--muted); margin-left: 2px; }
.stat-unit.gps { color: var(--gps); }
.stat-box.gps-box { border-color: var(--gps); }

/* ── Map ── */
#map {
  flex: 1 1 0;
  min-height: 38vh;
  width: 100%;
  background: #0a1520;
  z-index: 1;
}

/* Map overlay controls */
.map-btns {
  position: absolute;
  bottom: 18px; right: 10px;
  z-index: 1000;
  display: flex; flex-direction: column; gap: 6px;
}
.map-btn {
  width: 38px; height: 38px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.6);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: background .15s;
}
.map-btn:hover { background: var(--border); }

/* Leaflet dark theme */
.leaflet-tile { filter: brightness(0.52) saturate(0.35) hue-rotate(192deg); }
.leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }
.leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.6); }
.leaflet-popup-tip { background: var(--panel); }
.leaflet-popup-content { margin: 10px 14px; font-size: 13px; }

/* GPS pulse */
@keyframes gpsPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,.7); }
  60% { box-shadow: 0 0 0 14px rgba(0,255,136,0); }
}
.gps-dot { animation: gpsPulse 1.8s ease-in-out infinite; }

/* ── Desktop layout ── */
@media (min-width: 600px) {
  .shell { flex-direction: row; }
  .sidebar {
    width: 300px; flex: 0 0 300px;
    max-height: 100vh; height: 100%;
    border-right: 2px solid var(--border); border-bottom: none;
  }
  #map { height: 100%; min-height: unset; }
}
@media (min-width: 800px) {
  .sidebar { width: 320px; flex: 0 0 320px; }
}
</style>
</head>
<body>
<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-tag">TCDD · Demiryolu</div>
      <div class="logo-title">Rota Planlayıcı &amp; GPS</div>
      <div class="logo-sub">Gerçek OSM verisi &middot; Türkiye</div>
    </div>

    <div class="section">
      <div class="section-label">Güzergah</div>
      <div class="station-row">
        <div class="dot dot-a"></div>
        <div class="station-input-wrap">
          <input class="station-input" id="inputA" type="text"
            placeholder="Kalkış istasyonu…" autocomplete="off" autocorrect="off" spellcheck="false"/>
          <div class="autocomplete-list" id="listA"></div>
        </div>
      </div>
      <div class="station-row">
        <div class="dot dot-b"></div>
        <div class="station-input-wrap">
          <input class="station-input" id="inputB" type="text"
            placeholder="Varış istasyonu…" autocomplete="off" autocorrect="off" spellcheck="false"/>
          <div class="autocomplete-list" id="listB"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="btnRoute" disabled>Rotayı Göster</button>
      <button class="btn btn-outline" id="btnClear">Seçimi Temizle</button>
      <button class="btn btn-gps" id="btnGps">📍 GPS &amp; Hız Ölçer</button>
    </div>

    <div class="info-panel">
      <div class="loading-bar" id="loadingBar"><div class="loading-bar-fill"></div></div>
      <div class="status-msg" id="statusMsg">Harita altyapısı başlatılıyor…</div>
      <button class="btn-retry" id="btnRetry">↻ Yeniden Dene</button>

      <!-- Rota istatistikleri -->
      <div id="routeStats" style="display:none">
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-label">Mesafe</div>
            <div class="stat-value" id="statDist">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Tahmini Süre</div>
            <div class="stat-value" id="statTime">—</div>
          </div>
        </div>
      </div>

      <!-- GPS canlı istatistikleri -->
      <div id="gpsStats" style="display:none">
        <div class="stats-row">
          <div class="stat-box gps-box">
            <div class="stat-label" style="color:var(--gps)">Anlık Hız</div>
            <div class="stat-value live" id="statSpeed">0<span class="stat-unit gps">km/h</span></div>
          </div>
          <div class="stat-box gps-box" id="boxRemTime" style="display:none">
            <div class="stat-label" style="color:var(--gps)">Kalan Süre</div>
            <div class="stat-value live" id="statRemTime">—</div>
          </div>
        </div>
        <div class="stats-row" id="gpsCoordRow" style="display:none">
          <div class="stat-box" style="flex:2">
            <div class="stat-label">Konum</div>
            <div class="stat-value" id="statCoord" style="font-size:11px;color:var(--muted)">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Doğruluk</div>
            <div class="stat-value" id="statAccuracy" style="font-size:15px">—</div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAP -->
  <div id="map">
    <div class="map-btns">
      <button class="map-btn" id="btnFitRoute" title="Rotayı Ortala" style="display:none">⊕</button>
      <button class="map-btn" id="btnLocate"   title="Konumuma Git">📍</button>
      <button class="map-btn" id="btnFitTurkey" title="Türkiye'ye Dön">🗺</button>
    </div>
  </div>

</div>

<script>
'use strict';

/* ─── Global hata yakalayıcı ─────────────────────────────────────── */
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('statusMsg');
  if (el) { el.textContent = 'HATA: ' + msg; el.className = 'status-msg error'; }
  console.error('[Demiryolu Hata]', msg, err);
  return false;
};

document.addEventListener('DOMContentLoaded', function() {

  /* Leaflet kontrolü */
  if (typeof L === 'undefined') {
    document.getElementById('statusMsg').textContent =
      'Harita kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edip sayfayı yenileyin.';
    document.getElementById('statusMsg').className = 'status-msg error';
    return;
  }

  /* ── Harita başlatma ─────────────────────────────────────────────── */
  var map = L.map('map', {
    center: [39.0, 35.5],
    zoom: 6,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  /* Harita boyutunu düzelt (flex layout + ekran dönmesi) */
  function fixMap() { requestAnimationFrame(function() { map.invalidateSize(); }); }
  fixMap();
  [100, 300, 700, 1500].forEach(function(t) { setTimeout(fixMap, t); });
  window.addEventListener('resize', fixMap);
  window.addEventListener('orientationchange', function() { setTimeout(fixMap, 400); });

  /* ── Durum değişkenleri ─────────────────────────────────────────── */
  var railwayLines   = [];
  var stations       = [];
  var stationLayers  = [];
  var railLayers     = [];
  var routeLayer     = null;
  var currentPath    = [];
  var markerA        = null;
  var markerB        = null;
  var selectedA      = null;
  var selectedB      = null;

  var gpsWatchId      = null;
  var userMarker      = null;
  var accuracyCircle  = null;
  var lastPos         = null;
  var lastTime        = null;
  var currentSpeedKmh = 0;

  /* ── DOM referansları ────────────────────────────────────────────── */
  var statusEl    = document.getElementById('statusMsg');
  var loadingEl   = document.getElementById('loadingBar');
  var routeStats  = document.getElementById('routeStats');
  var gpsStats    = document.getElementById('gpsStats');
  var btnRoute    = document.getElementById('btnRoute');
  var btnClear    = document.getElementById('btnClear');
  var btnGps      = document.getElementById('btnGps');
  var btnRetry    = document.getElementById('btnRetry');
  var btnFitRoute = document.getElementById('btnFitRoute');
  var btnLocate   = document.getElementById('btnLocate');
  var btnFitTurkey= document.getElementById('btnFitTurkey');
  var boxRemTime  = document.getElementById('boxRemTime');
  var gpsCoordRow = document.getElementById('gpsCoordRow');

  /* ── Yardımcı fonksiyonlar ───────────────────────────────────────── */
  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status-msg' + (type ? ' ' + type : '');
  }
  function setLoading(on) {
    loadingEl.className = 'loading-bar' + (on ? ' active' : '');
  }

  /* Haversine mesafe hesabı (km) */
  function haversine(a, b) {
    var R = 6371, toR = Math.PI / 180;
    var dLat = (b[0] - a[0]) * toR;
    var dLon = (b[1] - a[1]) * toR;
    var sLat = Math.sin(dLat / 2);
    var sLon = Math.sin(dLon / 2);
    var x = sLat * sLat + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * sLon * sLon;
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  /* Süre biçimleme */
  function fmtTime(mins, unitColor) {
    var c = unitColor || 'var(--muted)';
    var su = '<span class="stat-unit" style="color:' + c + '">';
    if (mins < 60) return mins + su + 'dk</span>';
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + su + 'sa</span>' + (m ? ' ' + m + su + 'dk</span>' : '');
  }

  /* Türkçe karakter normalleştirme (arama için) */
  function norm(s) {
    return s.toLowerCase()
      .replace(/ı/g,'i').replace(/İ/g,'i')
      .replace(/ş/g,'s').replace(/Ş/g,'s')
      .replace(/ç/g,'c').replace(/Ç/g,'c')
      .replace(/ö/g,'o').replace(/Ö/g,'o')
      .replace(/ü/g,'u').replace(/Ü/g,'u')
      .replace(/ğ/g,'g').replace(/Ğ/g,'g');
  }

  /* ── Overpass API sorgusu (zaman aşımlı) ────────────────────────── */
  function fetchOverpass(query) {
    return new Promise(function(resolve, reject) {
      var done = false;
      var timer = setTimeout(function() {
        if (!done) { done = true; reject(new Error('Sunucu yanıt vermedi (zaman aşımı). Biraz bekleyip tekrar deneyin.')); }
      }, 35000);

      fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query)
      }).then(function(r) {
        clearTimeout(timer);
        done = true;
        if (!r.ok) {
          if (r.status === 429) throw new Error('Çok fazla istek (429). 1-2 dakika bekleyip tekrar deneyin.');
          throw new Error('Overpass API hatası: HTTP ' + r.status);
        }
        return r.json();
      }).then(resolve).catch(function(e) {
        clearTimeout(timer);
        if (!done) { done = true; reject(e); }
        else reject(e);
      });
    });
  }

  /* ── Demiryolu hatlarını yükle ───────────────────────────────────── */
  function loadRailways() {
    setLoading(true);
    btnRetry.className = 'btn-retry';
    setStatus('Türkiye demiryolu verileri indiriliyor (10–30 sn sürebilir)…');

    var q = '[out:json][timeout:90];\n' +
            'area["ISO3166-1"="TR"][admin_level=2]->.tr;\n' +
            '(way["railway"~"^(rail|narrow_gauge|light_rail|preserved)$"](area.tr););\n' +
            'out geom;';

    fetchOverpass(q).then(function(data) {
      railwayLines = [];
      data.elements.forEach(function(el) {
        if (el.type === 'way' && el.geometry && el.geometry.length >= 2) {
          railwayLines.push({
            coords: el.geometry.map(function(p) { return [p.lat, p.lon]; }),
            tags: el.tags || {}
          });
        }
      });
      drawRailways();
      setStatus(railwayLines.length + ' hat yüklendi — İstasyonlar alınıyor…');
      return loadStations();
    }).catch(function(e) {
      setLoading(false);
      setStatus('Veri hatası: ' + e.message, 'error');
      btnRetry.className = 'btn-retry show';
    });
  }

  function drawRailways() {
    railLayers.forEach(function(l) { map.removeLayer(l); });
    railLayers = [];
    /* Canvas renderer: çok sayıda segment için çok daha hızlı */
    var renderer = L.canvas();
    railwayLines.forEach(function(line) {
      var l = L.polyline(line.coords, {
        renderer: renderer,
        color: '#F5C518', weight: 1.8, opacity: 0.55,
        lineJoin: 'round', lineCap: 'round'
      }).addTo(map);
      railLayers.push(l);
    });
  }

  /* ── İstasyonları yükle ─────────────────────────────────────────── */
  function loadStations() {
    var q = '[out:json][timeout:60];\n' +
            'area["ISO3166-1"="TR"][admin_level=2]->.tr;\n' +
            '(node["railway"="station"](area.tr);\n' +
            ' node["railway"="halt"](area.tr););\n' +
            'out body;';

    return fetchOverpass(q).then(function(data) {
      stations = [];
      data.elements.forEach(function(el) {
        var name = (el.tags && (el.tags['name:tr'] || el.tags['name'])) || null;
        if (name) stations.push({ name: name, lat: el.lat, lng: el.lon, id: el.id, tags: el.tags || {} });
      });
      stations.sort(function(a, b) { return a.name.localeCompare(b.name, 'tr'); });
      drawStationDots();
      setLoading(false);
      setStatus('Hazır — ' + stations.length + ' istasyon yüklendi. Kalkış ve varış seçin.', 'success');
    }).catch(function(e) {
      setLoading(false);
      setStatus('İstasyon hatası: ' + e.message, 'error');
      btnRetry.className = 'btn-retry show';
    });
  }

  function drawStationDots() {
    stationLayers.forEach(function(m) { map.removeLayer(m); });
    stationLayers = [];
    var renderer = L.canvas();
    stations.forEach(function(st) {
      var m = L.circleMarker([st.lat, st.lng], {
        renderer: renderer,
        radius: 4, color: '#00B4D8',
        fillColor: '#00B4D8', fillOpacity: 0.8, weight:
