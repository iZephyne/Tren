<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerçek Zamanlı Hız Ölçer & Rota</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #04080F;
  --surface:   rgba(13, 24, 37, 0.95);
  --panel:     rgba(17, 30, 46, 0.95);
  --border:    rgba(28, 47, 69, 0.7);
  --border2:   #243D57;
  --rail:      #FFB300;
  --cyan:      #00E5FF;
  --red:       #FF2A55;
  --green:     #00FF9D;
  --text:      #E2F1FF;
  --text2:     #8AAEC8;
  --text3:     #4A6B85;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Inter', sans-serif;
}

/* Telefonlar için 100dvh (Dynamic Viewport Height) kullanıldı */
html, body { height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; touch-action: manipulation; }

.shell { display: flex; height: 100dvh; position: relative; flex-direction: row; }

/* ═══ SIDEBAR ═══ */
.sidebar {
  width: 360px; flex-shrink: 0; background: var(--surface);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  z-index: 2000; box-shadow: 4px 0 24px rgba(0,0,0,0.5);
}

.sidebar-scroll { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; padding-bottom: 20px;}

.header { padding: 20px 20px 15px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(4,8,15,0.9) 0%, rgba(17,30,46,0.5) 100%); }
.header-top { display: flex; align-items: center; justify-content: space-between; }
.badge { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--bg); font-weight: bold; background: var(--rail); border-radius: 4px; padding: 4px 8px; display: inline-block; margin-bottom: 6px; }
.header-title { font-size: 18px; font-weight: 700; color: #FFF; }
.clock-time { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--cyan); }
.clock-date { font-family: var(--mono); font-size: 10px; color: var(--text3); text-align: right;}

.section { padding: 15px 20px; border-bottom: 1px solid var(--border); }
.section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--cyan); margin-bottom: 10px; opacity: 0.9; }

.station-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.station-dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-a { background: var(--cyan); }
.dot-b { background: var(--red); }

.station-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; font-size: 14px; color: #FFF; outline: none; }
.btn-route { width: 100%; background: var(--rail); color: #000; border: none; border-radius: 8px; padding: 15px; font-size: 14px; font-weight: bold; margin-top: 10px; cursor: pointer; }
.btn-route:disabled { background: var(--border2); color: var(--text3); }

/* ═══ HARİTA VE DİJİTAL HIZ ÖLÇER ═══ */
#map { flex: 1; background: #03060A; z-index: 1;}
.leaflet-tile { filter: brightness(0.5) saturate(0.4) hue-rotate(200deg) contrast(1.2); }

/* DİJİTAL HIZ ÖLÇER (TELEFON ODAKLI) */
.telemetry-widget {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(8, 15, 24, 0.90); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 1px solid var(--cyan); border-radius: 20px; padding: 20px;
  z-index: 2000; display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0, 229, 255, 0.1);
  width: 90%; max-width: 340px; transition: 0.3s;
}
.tel-header { font-family: var(--mono); font-size: 12px; color: var(--cyan); display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.tel-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.tel-speed-box { 
  display: flex; align-items: baseline; justify-content: center; 
  background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 12px; 
  border: 1px solid rgba(0,229,255,0.2); width: 100%; margin: 10px 0;
}
.tel-speed-val { font-family: var(--mono); font-size: 56px; font-weight: 800; color: #FFF; letter-spacing: -2px; }
.tel-speed-unit { font-family: var(--mono); font-size: 18px; color: var(--cyan); margin-left: 8px; font-weight: 600; }
.tel-status { font-size: 12px; color: var(--text3); margin-bottom: 15px; text-align: center; }

.btn-track {
  background: transparent; border: 2px solid var(--green); color: var(--green);
  border-radius: 12px; padding: 14px; font-size: 15px; font-weight: bold;
  cursor: pointer; width: 100%; text-transform: uppercase;
}
.btn-track.active { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(0,255,157,0.4); }

/* GPS SABİT MARKER (RADAR KALDIRILDI) */
.gps-marker-core {
  width: 18px; height: 18px; background: var(--green); border-radius: 50%;
  border: 3px solid #000; box-shadow: 0 0 10px var(--green);
}

/* MOBİL TASARIM UYUMU */
@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; max-height: 40dvh; border-right: none; border-bottom: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .telemetry-widget { bottom: 20px; padding: 15px; width: 92%; }
  .tel-speed-val { font-size: 48px; }
  .header { padding: 15px; }
  .section { padding: 10px 15px; }
}
</style>
</head>
<body>
<div class="shell">

<aside class="sidebar">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="badge">SİSTEM AKTİF</div>
        <div class="header-title">Rota & Hız İzleme</div>
      </div>
      <div>
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate">---</div>
      </div>
    </div>
  </div>

  <div class="sidebar-scroll">
    <div class="section">
      <div class="section-label">📍 Rota Arama (Opsiyonel)</div>
      <input class="station-input" id="inputA" type="text" placeholder="Kalkış noktası..."/>
      <input class="station-input" id="inputB" type="text" placeholder="Varış noktası..." style="margin-top: 10px;"/>
      <button class="btn-route" id="btnRoute" disabled>VERİLER YÜKLENİYOR...</button>
    </div>
  </div>
</aside>

<div style="position:relative;flex:1;">
  <div id="map"></div>
  
  <!-- DİJİTAL HIZ ÖLÇER WIDGET -->
  <div class="telemetry-widget">
    <div class="tel-header"><div class="dot" id="gpsIndicator"></div> DİJİTAL HIZ ÖLÇER</div>
    <div class="tel-speed-box">
      <div class="tel-speed-val" id="gpsSpeedVal">00</div>
      <div class="tel-speed-unit">km/s</div>
    </div>
    <div class="tel-status" id="gpsStatusText">GPS Bağlantısı Bekleniyor...</div>
    <button class="btn-track" id="btnTrackToggle" onclick="toggleGPSTracking()">📍 CANLI HIZI İZLE</button>
  </div>
</div>

</div>

<script>
// Harita Ayarları
const map = L.map('map', { center: [39.0, 35.5], zoom: 6, zoomControl: false });
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

// Saat Sistemi
setInterval(() => {
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
  document.getElementById('clockDate').textContent = now.toLocaleDateString('tr-TR', {day:'numeric', month:'short'});
}, 1000);

// HIZ ÖLÇER VE GPS SİSTEMİ (RADARSIZ)
let gpsWatchId = null;
let gpsLastPos = null;
let gpsMarker = null;

function toggleGPSTracking() {
  const btn = document.getElementById('btnTrackToggle');
  const statusTxt = document.getElementById('gpsStatusText');
  const indicator = document.getElementById('gpsIndicator');

  if (gpsWatchId) {
    // Kapat
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null; gpsLastPos = null;
    if(gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; }
    btn.textContent = "📍 CANLI HIZI İZLE"; btn.classList.remove('active');
    statusTxt.textContent = "Konum izleme durduruldu.";
    document.getElementById('gpsSpeedVal').textContent = "00";
    indicator.style.background = "var(--red)";
  } else {
    // Aç
    if (!("geolocation" in navigator)) { alert("Tarayıcınız konum servisini desteklemiyor."); return; }
    
    btn.textContent = "🛑 İZLEMEYİ DURDUR"; btn.classList.add('active');
    statusTxt.textContent = "Uydular aranıyor... (Açık alanda bekleyin)";
    indicator.style.background = "var(--rail)";

    gpsWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        indicator.style.background = "var(--green)";
        statusTxt.textContent = "GPS Aktif - Hız Okunuyor";
        
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        
        // Hız Hesaplama (Milisaniyeyi ve metre/saniyeyi KM/H'ye çevir)
        let speedKmh = 0;
        if (pos.coords.speed !== null && pos.coords.speed > 0) {
          speedKmh = pos.coords.speed * 3.6; 
        } 
        
        // Çok düşük hızlardaki (ör. elde titreme) sapmaları engelle
        if(speedKmh < 2.0) speedKmh = 0; 

        // Sadece tam sayı olarak büyük ekranda göster
        document.getElementById('gpsSpeedVal').textContent = Math.round(speedKmh).toString().padStart(2, '0');

        // Haritada net ve sabit nokta olarak göster (RADAR KALDIRILDI)
        if (!gpsMarker) {
           const icon = L.divIcon({
              html: '<div class="gps-marker-core"></div>',
              className: '', iconSize: [18,18], iconAnchor: [9,9]
           });
           gpsMarker = L.marker([lat, lon], {icon: icon, zIndexOffset: 9999}).addTo(map);
           map.flyTo([lat, lon], 16, {animate: true, duration: 1.5}); // Yakınlaşma
        } else {
           gpsMarker.setLatLng([lat, lon]);
           map.panTo([lat, lon]); // Harekete göre ekranı takip et
        }
      },
      (err) => {
        statusTxt.textContent = "Hata: Konum izni verilmedi veya GPS kapalı.";
        indicator.style.background = "var(--red)";
        btn.textContent = "📍 TEKRAR DENE"; btn.classList.remove('active');
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  }
}

// BAĞLANTI HATASINI ÇÖZEN OVERPASS VERİ ÇEKİMİ
async function loadRailways() {
  // Daha hızlı yanıt vermesi için timeout'u artırdık ve sorguyu optimize ettik
  const q = `[out:json][timeout:50];area["ISO3166-1"="TR"]->.tr;(node["railway"="station"](area.tr););out geom;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST', body: 'data=' + encodeURIComponent(q)
    });
    if (!r.ok) throw new Error("Sunucu yanıt vermedi");
    const data = await r.json();
    document.getElementById('btnRoute').textContent = "HARİTA HAZIR";
    document.getElementById('btnRoute').disabled = false;
  } catch(e) {
    // Eğer sunucu hala yoğunsa programı kilitleme, sadece uyarı ver. Hız ölçer çalışmaya devam etsin.
    document.getElementById('btnRoute').textContent = "ROTA ÇİZİMİ GEÇİCİ KAPALI";
    console.warn("Rota verisi çekilemedi, ancak GPS hız ölçer kullanıma hazır.", e);
  }
}

// Başlangıçta çalıştır
loadRailways();
</script>
</body>
</html>
